# This workflow build examples, store the artifacts and deploy them to github pages.
# Generates the launchpad configuration file that can be used with the url.

name: Build Examples

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  Build:
    # Disable the job in forks
    if: ${{ github.repository_owner == 'espressif' }}

    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.idf_image || 'espressif/idf:v5.5.1' }}
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        example: [fan, led_light, multi_device, switch, temperature_sensor]
        target: [esp32, esp32c3, esp32c6, esp32s3, esp32c2, esp32h2]
        include:
          # Camera standalone requires IDF v5.5.5 and the KVS WebRTC SDK
          - example: camera/standalone
            target: esp32s3
            idf_image: espressif/idf:v5.5.5
            kvs_sdk_branch: main
          # Matter controller needs the ESP-Matter toolchain (gn, zap, host tools)
          # bundled in the esp-matter docker image. esp32s3 only (octal PSRAM, 8 MB flash).
          - example: matter/matter_controller
            target: esp32s3
            idf_image: espressif/esp-matter:release-v1.5_idf_v5.5.5
            optional: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Clone KVS WebRTC SDK
        if: ${{ matrix.kvs_sdk_branch != '' }}
        run: |
          git clone --depth 1 --shallow-submodules --recursive \
            -b ${{ matrix.kvs_sdk_branch }} \
            https://github.com/espressif/esp-port-for-amazon-kvs-sdk.git \
            /opt/kvs-sdk

      - run: mkdir -p images

      - name: build application
        run: |
          . $IDF_PATH/export.sh
          # esp-matter images carry ESP_MATTER_PATH; source its export.sh for gn/zap host tools
          [ -n "$ESP_MATTER_PATH" ] && . $ESP_MATTER_PATH/export.sh
          export ESP_RMAKER_PATH=$PWD
          [ -d /opt/kvs-sdk ] && export KVS_SDK_PATH=/opt/kvs-sdk
          cd examples/${{ matrix.example }}

          # Lets use the assisted claim by default for launchpad examples
          grep -q '^CONFIG_ESP_RMAKER_ASSISTED_CLAIM=y' sdkconfig.defaults || echo "CONFIG_ESP_RMAKER_ASSISTED_CLAIM=y" >> sdkconfig.defaults

          idf.py set-target ${{ matrix.target }} build

          cd build
          TARGET_CHIP=`cat project_description.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["target"])'`
          APP_BIN=`cat project_description.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["app_bin"])'`
          APP_ELF=`cat project_description.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["app_elf"])'`

          OUT_BIN=$ESP_RMAKER_PATH/images/"$TARGET_CHIP"_RainMaker_"$APP_BIN"
          esptool.py --chip $TARGET_CHIP merge_bin -o $OUT_BIN @flash_args

          # Keeps .symtab for function names and .debug_frame for the RISC-V GDB unwind.
          TOOLPREFIX=`cat project_description.json | python3 -c 'import sys,json; print(json.load(sys.stdin)["monitor_toolprefix"])'`
          "${TOOLPREFIX}objcopy" --strip-debug --keep-section=.debug_frame "$APP_ELF" app_stripped.elf
          gzip -9nc app_stripped.elf > "${OUT_BIN%.bin}.elf.gz"

      - name: Set artifact name
        id: artifact
        run: echo "name=build-images-${{ matrix.target }}-$(echo '${{ matrix.example }}' | tr '/' '_')" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: images

  deploy:
    # Disable the job in forks
    if: ${{ github.repository_owner == 'espressif' }}

    needs: Build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1

    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          submodules: 'recursive'

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: build-images-*
          path: images/
          merge-multiple: true

      - name: generate launchpad config
        run: |
          export ESP_RMAKER_PATH=$PWD

          cd images
          $ESP_RMAKER_PATH/tools/launchpad/generate_launchpad_config.sh ${{ github.repository_owner }} `basename ${{ github.repository }}`

          echo "#### Build Config" >> build_cfg.md
          echo "" >> build_cfg.md
          echo "" >> build_cfg.md
          echo "- ESP-IDF: [`git -C $IDF_PATH rev-parse HEAD`](https://github.com/espressif/esp-idf/tree/`git -C $IDF_PATH rev-parse HEAD`)" >> build_cfg.md
          echo "- ESP-RainMaker: [${{steps.checkout.outputs.commit}}](https://github.com/espressif/esp-rainmaker/tree/${{steps.checkout.outputs.commit}})" >> build_cfg.md
          echo "" >> build_cfg.md
          echo "" >> build_cfg.md

          echo "#### Debug Symbols" >> build_cfg.md
          echo "" >> build_cfg.md
          echo "Each image has a gzipped app ELF next to it, at \`<target>_RainMaker_<app>.elf.gz\`." >> build_cfg.md
          echo "The ELF has no DWARF debug info except \`.debug_frame\`, so a backtrace decodes to function names only." >> build_cfg.md
          echo "Use it to decode a backtrace from a device that runs that image:" >> build_cfg.md
          echo "" >> build_cfg.md
          echo "\`\`\`" >> build_cfg.md
          echo "gunzip <target>_RainMaker_<app>.elf.gz" >> build_cfg.md
          echo "# Xtensa targets:" >> build_cfg.md
          echo "python -m esp_idf_monitor -p <port> --target <target> --toolchain-prefix xtensa-<target>-elf- <target>_RainMaker_<app>.elf" >> build_cfg.md
          echo "# RISC-V targets:" >> build_cfg.md
          echo "python -m esp_idf_monitor -p <port> --decode-panic backtrace --target <target> --toolchain-prefix riscv32-esp-elf- <target>_RainMaker_<app>.elf" >> build_cfg.md
          echo "\`\`\`" >> build_cfg.md
          echo "" >> build_cfg.md
          echo "The monitor prints \"Checksum mismatch between flashed and built applications\" for this ELF." >> build_cfg.md
          echo "This is expected: the firmware records the checksum of the full ELF, before the strip step." >> build_cfg.md
          echo "" >> build_cfg.md

          cat $ESP_RMAKER_PATH/tools/launchpad/app_link_guide.md >> build_cfg.md

          if ! command -v tree >/dev/null 2>&1; then
            echo "tree not found, installing..."
            apt-get update && apt-get install -y tree
          fi

          tree -H '.' -L 1 --noreport -T 'ESP RainMaker Launchpad Artifacts' -shi --charset utf-8 -I "index.html" -o index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: images/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
