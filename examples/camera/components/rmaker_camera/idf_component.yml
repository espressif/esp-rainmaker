dependencies:
  espressif/esp_rainmaker:
    version: ">=1.0"

  espressif/json_parser:
    version: "~2.0.0"

  # Common dependencies
  esp_webrtc_utils:
    path: ${KVS_SDK_PATH}/components/esp_webrtc_utils
    version: "*"

  app_webrtc:
    path: ${KVS_SDK_PATH}/components/app_webrtc
    version: "*"

  kvs_signaling:
    path: ${KVS_SDK_PATH}/components/signaling/kvs_signaling
    version: "*"

  # Split mode dependencies
  espressif/esp_hosted:
    version: "3.1.0"
    rules:
      - if: "target in [esp32c6, esp32c5]"

  signaling_bridge_adapter:
    path: ${KVS_SDK_PATH}/components/signaling_bridge_adapter
    version: "*"
    rules:
      - if: "target in [esp32c6, esp32c5]"

  # Standalone mode dependencies
  kvs_webrtc:
    path: ${KVS_SDK_PATH}/components/kvs_webrtc
    version: "*"
    rules:
      - if: "target not in [esp32c6, esp32c5]"

  media_stream:
    path: ${KVS_SDK_PATH}/components/media_stream
    version: "*"
