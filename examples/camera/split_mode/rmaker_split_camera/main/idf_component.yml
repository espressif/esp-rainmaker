## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: ">=5.5.5"
  espressif/esp_rainmaker:
    version: ">=1.0"
    override_path: ../../../../../components/esp_rainmaker
  espressif/button:
    version: "^4.1.4"
  espressif/json_parser:
    version: "~2.0.0"
  espressif/rmaker_common:
    version: "*"
  espressif/rmaker_app_reset:
    version: "*"
  espressif/rmaker_app_network:
    version: "*"
    override_path: ../../../../common/rmaker_app_network
  espressif/rmaker_app_insights:
    version: "*"

  # Components from KVS SDK
  # This build is the esp_hosted co-processor: it runs signaling locally and
  # serves the P4 host over SDIO. Keep the version in step with the host side
  # (the KVS SDK's streaming_only).
  espressif/esp_hosted:
    version: "3.1.0"
    rules:
      - if: "target in [esp32c6, esp32c5]"
  esp_webrtc_utils:
    path: ${KVS_SDK_PATH}/components/esp_webrtc_utils
    version: "*"
  app_webrtc:
    path: ${KVS_SDK_PATH}/components/app_webrtc
    version: "*"
  signaling_bridge_adapter:
    path: ${KVS_SDK_PATH}/components/signaling_bridge_adapter
    version: "*"
  webrtc_bridge:
    path: ${KVS_SDK_PATH}/components/webrtc_bridge
    version: "*"

  # Local components
  rmaker_camera:
    path: ../../../components/rmaker_camera
    version: "*"
