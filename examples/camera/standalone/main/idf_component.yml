## IDF Component Manager Manifest File
dependencies:
  ## Required IDF version
  idf:
    version: ">=5.4.0"
  espressif/esp_rainmaker:
    version: ">=1.0"
    override_path: ../../../../components/esp_rainmaker
  espressif/button:
    version: "^4.1.4"
  espressif/json_parser:
    version: "~1.0.3"
  espressif/rmaker_common:
    version: "*"
  espressif/rmaker_app_reset:
    version: "*"
  espressif/rmaker_app_network:
    version: "*"
  espressif/rmaker_app_insights:
    version: "*"

  # Components from KVS SDK
  esp_webrtc_utils:
    path: ${KVS_SDK_PATH}/components/esp_webrtc_utils
    version: "*"
  app_webrtc:
    path: ${KVS_SDK_PATH}/components/app_webrtc
    version: "*"
  kvs_webrtc:
    path: ${KVS_SDK_PATH}/components/kvs_webrtc
    version: "*"
  media_stream:
    path: ${KVS_SDK_PATH}/components/media_stream
    version: "*"
  espressif/esp_hosted:
    override_path: ${KVS_SDK_PATH}/components/esp_hosted
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_wifi_remote:
    version: "*"
    rules:
      - if: "target in [esp32p4]"
  # Use the local P4-EYE BSP from the KVS SDK: it does the board-specific
  # camera bring-up (XCLK allocate/start, sensor reset + enable pins) that the
  # stock registry BSP omits — without it the OV2710 gets no master clock and
  # never ACKs on SCCB ("Get sensor ID failed" -> session comes up audio-only).
  espressif/esp32_p4_eye:
    version: "*"
    override_path: ${KVS_SDK_PATH}/examples/common_components/esp32_p4_eye
    matches:
      - if: $CONFIG{ESP32_P4_EYE} == 1 && $CONFIG{BSP_SELECT_GLIB_SEL} == 1

  # Host-side flasher for the on-board co-processor (C6/C5). Enabled by the
  # P4 board overlays (p4_eye / p4x_eye / p4_c5_core_board) that ship the
  # slave image in a 'slave' SPIFFS partition; a no-op when disabled.
  slave_flasher:
    path: ${KVS_SDK_PATH}/components/slave_flasher
    version: "*"
    rules:
      - if: "target in [esp32p4]"

  # Local components
  rmaker_camera:
    path: ../../components/rmaker_camera
    version: "*"
